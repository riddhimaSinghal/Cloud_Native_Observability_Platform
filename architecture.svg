<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" font-family="Segoe UI, Arial, sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4a5a68"/></marker>
  </defs>
  <rect width="980" height="600" fill="#f4f6f8"/>
  <text x="490" y="30" text-anchor="middle" font-size="18" font-weight="600" fill="#17212b">AI-Powered Cloud Monitoring and Predictive Failure Detection - AWS Architecture</text>

  <!-- AWS region -->
  <rect x="190" y="50" width="770" height="530" rx="8" fill="#fff" stroke="#8a97a3" stroke-dasharray="6 4"/>
  <text x="205" y="72" fill="#5d6b77" font-weight="600">AWS Region (ap-south-1) - provisioned by one CloudFormation stack</text>

  <!-- User -->
  <rect x="20" y="250" width="140" height="70" rx="6" fill="#e6f0f7" stroke="#1f5f8b"/>
  <text x="90" y="278" text-anchor="middle" font-weight="600">Administrator</text>
  <text x="90" y="297" text-anchor="middle" fill="#5d6b77">Browser: React +</text>
  <text x="90" y="312" text-anchor="middle" fill="#5d6b77">Chart.js dashboard</text>

  <!-- EC2 -->
  <rect x="230" y="95" width="360" height="300" rx="6" fill="#fdf1e3" stroke="#d4781f" stroke-width="2"/>
  <text x="410" y="118" text-anchor="middle" font-weight="700" fill="#8a4a0b">EC2 t3.micro (Amazon Linux 2023)</text>
  <text x="410" y="135" text-anchor="middle" fill="#8a4a0b" font-size="11">Security Group: port 80 from AllowedCidr only - IAM role (least privilege) - IMDSv2</text>
  <rect x="250" y="150" width="150" height="50" rx="4" fill="#fff" stroke="#b9a58c"/><text x="325" y="170" text-anchor="middle" font-weight="600">1. Collector</text><text x="325" y="187" text-anchor="middle" fill="#5d6b77" font-size="11">psutil / simulator</text>
  <rect x="420" y="150" width="150" height="50" rx="4" fill="#fff" stroke="#b9a58c"/><text x="495" y="170" text-anchor="middle" font-weight="600">2. ML engine</text><text x="495" y="187" text-anchor="middle" fill="#5d6b77" font-size="11">Isolation Forest + risk</text>
  <rect x="250" y="225" width="150" height="50" rx="4" fill="#fff" stroke="#b9a58c"/><text x="325" y="245" text-anchor="middle" font-weight="600">3. Storage layer</text><text x="325" y="262" text-anchor="middle" fill="#5d6b77" font-size="11">memory + DynamoDB</text>
  <rect x="420" y="225" width="150" height="50" rx="4" fill="#fff" stroke="#b9a58c"/><text x="495" y="245" text-anchor="middle" font-weight="600">4. Alert manager</text><text x="495" y="262" text-anchor="middle" fill="#5d6b77" font-size="11">streak + cool-down</text>
  <rect x="250" y="305" width="320" height="60" rx="4" fill="#fff" stroke="#b9a58c"/><text x="410" y="328" text-anchor="middle" font-weight="600">FastAPI (REST /api/*) + serves React build</text><text x="410" y="347" text-anchor="middle" fill="#5d6b77" font-size="11">API-key auth on write endpoints - input validation - security headers</text>
  <path d="M400 175H420" stroke="#4a5a68" marker-end="url(#a)"/>
  <path d="M495 200V225" stroke="#4a5a68" marker-end="url(#a)"/>
  <path d="M440 200V212H325V225" fill="none" stroke="#4a5a68" marker-end="url(#a)"/>
  <path d="M325 275V290H410V305" fill="none" stroke="#4a5a68" marker-end="url(#a)"/>

  <!-- User to EC2 -->
  <path d="M160 285H230" stroke="#4a5a68" stroke-width="2" marker-end="url(#a)"/>
  <text x="195" y="277" text-anchor="middle" fill="#4a5a68" font-size="11">HTTP :80</text>

  <!-- Right-hand services -->
  <rect x="660" y="95" width="270" height="62" rx="6" fill="#e4f2ec" stroke="#2e7d5b"/><text x="795" y="120" text-anchor="middle" font-weight="700">Amazon CloudWatch</text><text x="795" y="140" text-anchor="middle" fill="#5d6b77" font-size="12">Custom metrics (FailureRisk, CPU...) + EC2 metrics</text>
  <rect x="660" y="190" width="270" height="55" rx="6" fill="#e4f2ec" stroke="#2e7d5b"/><text x="795" y="214" text-anchor="middle" font-weight="700">CloudWatch Alarms (3)</text><text x="795" y="232" text-anchor="middle" fill="#5d6b77" font-size="12">High CPU - status check - risk &gt;= 75</text>
  <rect x="660" y="280" width="270" height="55" rx="6" fill="#f3e6f7" stroke="#8a4fa0"/><text x="795" y="304" text-anchor="middle" font-weight="700">Amazon SNS topic</text><text x="795" y="322" text-anchor="middle" fill="#5d6b77" font-size="12">Email subscription (confirmed by admin)</text>
  <rect x="660" y="370" width="270" height="55" rx="6" fill="#e6f0f7" stroke="#1f5f8b"/><text x="795" y="394" text-anchor="middle" font-weight="700">Amazon DynamoDB (2 tables)</text><text x="795" y="412" text-anchor="middle" fill="#5d6b77" font-size="12">metrics (24h TTL) + alerts - on-demand billing</text>
  <rect x="660" y="465" width="270" height="55" rx="6" fill="#eef0f2" stroke="#6b7782"/><text x="795" y="489" text-anchor="middle" font-weight="700">Amazon S3 (code bucket)</text><text x="795" y="507" text-anchor="middle" fill="#5d6b77" font-size="12">project zip pulled at boot by UserData</text>

  <!-- Email -->
  <rect x="470" y="425" width="150" height="50" rx="6" fill="#fbe9e7" stroke="#b3202a"/><text x="545" y="447" text-anchor="middle" font-weight="700">Admin email</text><text x="545" y="464" text-anchor="middle" fill="#5d6b77" font-size="12">alert before downtime</text>

  <!-- connectors -->
  <path d="M570 175H620V126H660" fill="none" stroke="#4a5a68" marker-end="url(#a)"/>
  <text x="615" y="166" fill="#4a5a68" font-size="10" text-anchor="end">put_metric_data</text>
  <path d="M795 157V190" stroke="#4a5a68" marker-end="url(#a)"/>
  <path d="M795 245V280" stroke="#4a5a68" marker-end="url(#a)"/>
  <path d="M570 250H610V308H660" fill="none" stroke="#b3202a" stroke-width="2" marker-end="url(#a)"/>
  <text x="614" y="303" fill="#b3202a" font-size="10">sns:Publish</text>
  <path d="M570 270H635V397H660" fill="none" stroke="#4a5a68" marker-end="url(#a)"/>
  <text x="630" y="391" text-anchor="end" fill="#4a5a68" font-size="10">put_item</text>
  <path d="M660 322H645V450H620" fill="none" stroke="#b3202a" stroke-width="2" marker-end="url(#a)"/>
  <path d="M660 510H300V395" fill="none" stroke="#6b7782" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <text x="480" y="525" fill="#6b7782" font-size="10">code downloaded at boot</text>

  <!-- CloudFormation -->
  <rect x="230" y="430" width="200" height="60" rx="6" fill="#fff" stroke="#8a97a3"/><text x="330" y="454" text-anchor="middle" font-weight="700">AWS CloudFormation</text><text x="330" y="472" text-anchor="middle" fill="#5d6b77" font-size="12">creates every resource above</text>
  <text x="20" y="470" fill="#5d6b77" font-size="12">Data flow:</text>
  <text x="20" y="490" fill="#5d6b77" font-size="12">collect -&gt; ML score -&gt; store -&gt;</text>
  <text x="20" y="508" fill="#5d6b77" font-size="12">dashboard + alert email</text>
</svg>
